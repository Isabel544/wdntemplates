<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="color-scheme" content="dark light">
        <title>Profile Toggle Buttons</title>
        <link rel="stylesheet" href="/wdn/templates_6.0/css/critical.css">
        <link rel="stylesheet" href="/wdn/templates_6.0/css/main.css">
        <script src="/wdn/templates_6.0/js/head-2.js"></script>
    </head>
    <body class="unl">
        <main>
            <h1>Profile Toggle</h1>
            <form class="dcf-form" action="?" method="post">
                <fieldset>
                    <div class="dcf-form-group">
                        <label for="helpful_comments">Comments</label>
                        <textarea id="helpful_comments" cols="60" rows="5"></textarea>
                    </div>

                    <div class="dcf-form-group">
                        <button
                            class="dcf-profile-toggle dcf-btn dcf-btn-primary"
                            data-controls="profile-toggle-div"
                            data-label-on="Open Profile Toggle Div"
                            data-label-off="Close Profile Toggle Div"
                            data-start-expanded="false"
                        >
                            Required If Toggled
                        </button>
                        <fieldset id="profile-toggle-div">
                            <legend>Required Content</legend>            
                            <div class="dcf-form-group">
                                <label for="name">
                                    Name 
                                    <small class="dcf-required">Required</small>
                                </label>
                                <input id="name" type="text" data-required="false" >
                            </div>          
                            
                            <fieldset class="dcf-form-group dcf-d-flex dcf-flex-col">
                                <legend class="dcf-legend">Checkboxes</legend>
                                <div class="dcf-input-checkbox">
                                    <input id="elements-form-checkboxA" type="checkbox"                             value="0" aria-labelledby="elements-form-checkboxA-label">
                                    <label for="elements-form-checkboxA"                            id="elements-form-checkboxA-label">Checkbox A</label>
                                </div>
                                <div class="dcf-input-checkbox">
                                    <input id="elements-form-checkboxB" type="checkbox"                             
                                    value="1" aria-labelledby="elements-form-checkboxB-label"                           disabled="">
                                    <label for="elements-form-checkboxB"                            id="elements-form-checkboxB-label">Checkbox B</label>
                                </div>
                                <div class="dcf-input-checkbox">
                                    <input id="elements-form-checkboxC" type="checkbox"                             
                                    value="2" aria-labelledby="elements-form-checkboxC-label">
                                    <label for="elements-form-checkboxC"                            id="elements-form-checkboxC-label">Checkbox C</label>
                                </div>
                            </fieldset>

                            <button
                                class="dcf-profile-toggle dcf-btn dcf-btn-primary"
                                data-controls="nested-profile-toggle-div"
                                data-label-on="Open Profile Toggle Div"
                                data-label-off="Close Profile Toggle Div"
                                data-start-expanded="false"
                            >
                                Required If Toggled 2
                            </button>
                            <fieldset id="nested-profile-toggle-div">
                                <legend>Required Nested Content</legend>            
                                <div class="dcf-form-group">
                                    <label for="email">
                                        Email 
                                        <small class="dcf-required">Required</small>
                                    </label>
                                    <input id="email" type="email" data-required="false" >
                                </div>
                            </fieldset>

                        </fieldset>
                    </div>
                </fieldset>
                <input class="dcf-btn dcf-btn-primary" name="submit" type="submit" value="Submit">
            </form>
            *Note: Submission is possible without filling in required fields 
            as long as toggle is not in expanded form
        </main>

        <script>
        document.getElementById('profile-toggle-div').addEventListener('toggleProfileReady', (e) => {
            console.log('Event Name: toggleProfileReady', e);
        });
        document.addEventListener('UNLPluginInitialized', (e) => {
            console.log('Event Name: UNLPluginInitialized', e);
        });
        document.addEventListener('UNLPluginLoadedElement', (e) => {
            console.log('Event Name: UNLPluginLoadedElement', e);
        });
        window.UNL.autoLoader.config.plugins.UNLToggleProfile.onPluginLoadedElement = (loaded_element) => {
            console.log('Auto Loader onPluginLoadedElement:', loaded_element);
        }
        </script>
        
        <script src="/wdn/templates_6.0/js/auto-loader.js" type="module"></script>

        <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.querySelector('form');
            const toggleSection = document.getElementById('profile-toggle-div');
        
            // Keep required + data-required in sync with data-expanded
            function updateRequiredFromState() {
                const isOpen = toggleSection.getAttribute('data-expanded') === 'true';
                const inputs = toggleSection.querySelectorAll('[data-required]');
            
                inputs.forEach(input => {
                    input.setAttribute('data-required', isOpen ? 'true' : 'false');
                
                    if (isOpen) {
                        input.setAttribute('required', '');
                    } else {
                        input.removeAttribute('required');
                    }
                });
            }
        
            toggleSection.addEventListener('toggleElementOn', () => {
                toggleSection.setAttribute('data-expanded', 'true');
                updateRequiredFromState();
            });
        
            toggleSection.addEventListener('toggleElementOff', () => {
                toggleSection.setAttribute('data-expanded', 'false');
                updateRequiredFromState();
            });
        
            if (!toggleSection.hasAttribute('data-expanded')) {
                toggleSection.setAttribute('data-expanded', 'false');
            }
            updateRequiredFromState();
        
            form.addEventListener('submit', function (e) {
                updateRequiredFromState(); // ensure latest state before validating
            
                if (!form.checkValidity()) {
                    e.preventDefault();
                    form.reportValidity();
                } else {
                    alert('Success! Form submitted.');
                }
            });
        });
        </script>
    </body>
</html>
